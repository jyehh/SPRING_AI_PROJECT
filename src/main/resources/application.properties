## [프로젝트 기본 설정]
spring.application.name=spring-ai-project
server.port=8080
spring.output.ansi.enabled=ALWAYS

## [로깅 설정]
# 콘솔 출력 포맷: [레벨(초록색)] [클래스.메소드(청록색)]: 메시지
logging.pattern.console=%clr(%-5level){green} %clr(%logger.%M\\(\\)){cyan}: %msg%n
# 우리 프로젝트 로그 레벨 (상세 흐름 파악을 위해 DEBUG 설정)
logging.level.com.example.demo=DEBUG
# Spring AI 및 하이버네이트는 기본 정보만 출력
logging.level.org.springframework.ai=INFO
# SimpleLoggerAdvisor 로그 활성화
logging.level.org.springframework.ai.chat.client.advisor=DEBUG
# (필요시 주석 해제) SQL에 들어가는 실제 파라미터 값을 보고 싶을 때 사용
# logging.level.org.hibernate.orm.jdbc.bind=TRACE

## [Ollama AI 설정]
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=gemma2:9b
spring.ai.ollama.embedding.options.model=BGE-M3:latest

## [PostgreSQL (pgvector) 연결 설정]
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=dana
spring.datasource.password=123!@#

## [JPA / Hibernate 설정]
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

## [벡터 스토어 설정]
# 서버 시작 시 벡터 DB 스키마(테이블 등) 자동 생성
#spring.ai.vector-store.pgvector.initialize-schema=true
