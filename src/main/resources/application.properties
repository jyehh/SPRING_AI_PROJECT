### [비속어 필터 설정]
## RAG 검색 시 최소 유사도 하한선 (이 점수 미만은 무시)
#filter.rag.min-similarity=0.50
## 비속어 확정 임계치 (이 점수 이상이면 비속어로 판단)
#filter.rag.similarity-threshold=0.80
## 검색할 상위 결과 개수
#filter.rag.top-k=5
## Fuzzy 검색 임계치
#filter.fuzzy.threshold=0.88
## 캐시 최대 크기
#filter.cache.max-size=1000
