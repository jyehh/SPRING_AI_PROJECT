#spring.ai.vectorstore.pgvector.table-name=new_vector_store
## 거리 계산 방식 명시 (기본값인 cosine을 명시적으로 선언)
#spring.ai.vector-store.pgvector.distance-type=cosine-distance
#spring.ai.vector-store.pgvector.index-type = HNSW
